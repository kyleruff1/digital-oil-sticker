# Fly.io configuration (ADR-0004 posture, owner-approved 2026-08-01).
# This host serves the Phoenix LiveView app and the READ-ONLY catalog baked
# into the image. It stores NO personal records; the user's garage lives in
# their browser (INV-23) and is hydrated per INV-24.
#
# No [[mounts]] and no release_command: the catalog is a build artifact
# shipped inside the image (chmod 0444), not state — there is nothing to
# migrate at deploy time. Always-on (no scale-to-zero): a cold start that
# drops live LiveView sockets is worse than the ~$3-5/mo it saves.

app = "digital-oil-sticker"
primary_region = "ord"

[build]

[env]
  PHX_HOST = "digital-oil-sticker.fly.dev"
  PORT = "8080"
  # CATALOG_DATABASE_PATH deliberately unset: runtime.exs resolves the baked
  # artifact via Application.app_dir/2, which survives release version bumps.

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 200
    soft_limit = 100

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "15s"
  method = "GET"
  path = "/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
